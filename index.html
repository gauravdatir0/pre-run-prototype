<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15242B" />
  <title>Pre-Run Prototype Evaluation</title>
  <style>
    :root{--ink:#15242B;--muted:#5c6d74;--paper:#eef3f5;--white:#fff;--green:#4A9A68;--gray:#687A82;--a:#167C80;--aBg:#124F52;--b:#D86B38;--bBg:#67351F;--c:#6A55A3;--cBg:#3E315F;--ring:#101820}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink)}
    button,a{font:inherit}
    button{touch-action:manipulation}
    .app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:max(18px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom))}
    .shell{width:min(100%,560px)}
    .head{text-align:center;margin:2px 0 14px}
    .head h1{font-size:clamp(1.45rem,6vw,2rem);margin:0 0 8px;line-height:1.08}
    .head p{margin:0;color:var(--muted);line-height:1.4}
    .accent{height:4px;border-radius:99px;background:var(--accent,var(--a));margin:14px 0 18px}
    .card{background:#fff;border:1px solid #cedadd;border-radius:22px;padding:20px;box-shadow:0 10px 28px rgba(14,36,44,.08)}
    .task{text-align:center;font-size:1.03rem;line-height:1.55}
    .task strong{display:block;font-size:1.25rem;margin-bottom:12px}
    .scenario{margin:18px 0;padding:14px;border-radius:14px;background:#e2ebee;text-align:center;font-weight:700}
    .primary,.secondary{border:0;border-radius:14px;min-height:52px;padding:12px 18px;font-weight:800;cursor:pointer;width:100%}
    .primary{background:var(--accent,var(--a));color:white}.secondary{background:#dce6e9;color:var(--ink)}
    .prototype-grid{display:grid;gap:14px}
    .proto-card{border:2px solid var(--accent);border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 7px 20px rgba(14,36,44,.07)}
    .proto-band{background:var(--accent);color:white;font-weight:900;padding:12px 16px}
    .proto-body{padding:17px}.proto-body h2{margin:0 0 8px;font-size:1.3rem}.proto-body p{margin:0 0 14px;color:var(--muted);line-height:1.4}
    .dial-wrap{text-align:center}
    .dial{position:relative;width:min(88vw,440px);aspect-ratio:1;margin:0 auto;background:var(--ring);border-radius:50%;padding:18px;box-shadow:0 18px 38px rgba(0,0,0,.22)}
    .dial-face{height:100%;border-radius:50%;background:var(--dialBg,#1D3038);border:3px solid var(--accent);color:white;padding:34px 30px 26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative}
    .proto-label{font-size:.72rem;letter-spacing:.13em;font-weight:900;color:#c5d1d5;margin-bottom:9px}
    .screen-title{font-size:clamp(1.18rem,5.5vw,1.65rem);font-weight:900;margin:0;text-transform:uppercase}
    .divider{width:75%;height:3px;border-radius:99px;background:var(--accent);margin:13px auto 16px}
    .screen-copy{min-height:120px;width:100%;display:flex;flex-direction:column;justify-content:center;gap:8px;font-size:clamp(.92rem,4vw,1.08rem);line-height:1.25}
    .screen-copy strong{font-size:1.12em}.screen-copy .muted{color:#cad5d9}.screen-copy .accent-text{color:var(--accent);font-weight:900;font-size:1.3em}
    .center-action{width:88%;min-height:52px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.09);color:white;border-radius:14px;font-weight:900;letter-spacing:.025em;cursor:pointer;margin-top:auto}
    .dial-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:88%;margin-top:12px}
    .dial-buttons button{border:0;border-radius:12px;min-height:46px;color:white;font-weight:900;cursor:pointer}.start{background:var(--green)}.skip{background:var(--gray)}
    .resume{margin:20px auto 0;display:block;width:min(88vw,360px);min-height:52px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:900;cursor:pointer}
    .progress{margin:16px auto 0;color:var(--muted);text-align:center;font-size:.9rem}
    .eval-list{text-align:left;line-height:1.5;padding-left:22px}.eval-list li{margin:8px 0}
    .actions{display:grid;gap:10px;margin-top:18px}
    .disclaimer{font-size:.76rem;color:#718188;text-align:center;margin:18px auto 0;line-height:1.35}
    .hidden{display:none!important}
    @media (min-width:700px){.prototype-grid{grid-template-columns:repeat(3,1fr)}.shell.menu-shell{width:min(100%,980px)}}
    @media (max-height:700px) and (orientation:landscape){.dial{width:min(72vh,420px)}.app{padding-top:8px}.head{margin-bottom:6px}.head p{display:none}.accent{margin:8px 0 10px}}
    @media (prefers-reduced-motion:no-preference){.card,.dial{animation:in .25s ease-out}@keyframes in{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
<main class="app"><div id="shell" class="shell" aria-live="polite"></div></main>
<script>
(() => {
  const FORM_URL = 'PASTE_MICROSOFT_FORMS_RESPONSE_LINK_HERE';
  const P = {
    A:{name:'Visual Dashboard',accent:'#167C80',bg:'#124F52',intro:'A visual overview of weather, hydration, and pacing information.',when:'Shown when you open pre-run preparation. Details appear only when you choose to review them.',availability:'Not shown automatically. It is available on demand.',screens:[
      ['Pre-Run Dashboard','8.0 mi • about 75 min|Weather • water • pace|~3 preparation items'],
      ['Overview','*Weather: Warm|Hydration: Water suggested|Pace: Start easier'],
      ['Weather','*82°F at start|Humidity: 72%|Light wind|~May feel harder'],
      ['Hydration','*Water recommended|Carry water or plan a refill|~Drink based on thirst'],
      ['Pace','*Start easier|Comfortable effort early|~Adjust to conditions'],
      ['Ready to Run','Weather reviewed|Water considered|Pace reviewed|!READY']
    ]},
    B:{name:'Exception Briefing',accent:'#D86B38',bg:'#67351F',intro:'A short multimodal alert for conditions that differ from the normal running context.',when:'The normal run screen remains unchanged unless an unusual or important condition is detected.',availability:'This experience is exception-based and is not shown for every run.',screens:[
      ['Outdoor Run','*Checking conditions…|~No preparation screen by default'],
      ['Attention','*Two short vibrations|Warm + humid conditions|~Briefing available'],
      ['Briefing','*Conditions may increase effort|Carry water|Start easier'],
      ['Why Now?','*82°F • 72% humidity|Warmer than recent runs|Longer planned duration'],
      ['Quick Action','*Water reminder?|Easy-start cue?|~Both remain optional'],
      ['Acknowledged','Water reminder on|Easy-start cue on|~No other exceptions|!READY']
    ]},
    C:{name:'Preparation Assistant',accent:'#6A55A3',bg:'#3E315F',intro:'A conversational assistant that adapts preparation suggestions to the run plan and recent behavior.',when:'Shown when you open the preparation assistant before a planned run. Personalized insights appear when relevant data is available.',availability:'Not always shown automatically. Some insights depend on available history.',screens:[
      ['Assistant','*Good evening|I can help prepare your run|~8 miles • 6:00 PM'],
      ["Today’s Goal",'*Comfort|Performance|Just essentials'],
      ['Insight','*Recent warm-weather starts|were faster than usual|~Begin slightly easier'],
      ['Why?','Planned distance|Heat + humidity|Recent run pattern'],
      ['Hydration','*Warm + humid expected|Add water reminder?|Show refill options?'],
      ['Your Plan','*Easy start|Water reminder|~Comfort-focused'],
      ['Plan Ready','Suggestions accepted|Reminder added|~Controls remain available|!READY']
    ]}
  };
  const shell=document.getElementById('shell'); let state={view:'start',proto:null,index:-1};
  const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function top(title,sub,accent){return `<header class="head"><h1>${esc(title)}</h1><p>${esc(sub)}</p></header><div class="accent" style="--accent:${accent}"></div>`}
  function set(html, cls='shell'){shell.className=cls;shell.innerHTML=html;window.scrollTo({top:0,behavior:'instant'});bind()}
  function bind(){shell.querySelectorAll('[data-go]').forEach(x=>x.addEventListener('click',()=>go(x.dataset.go)));}
  function go(cmd){
    if(cmd==='menu'){state={view:'menu',proto:null,index:-1};return renderMenu()}
    if(cmd==='start'){return renderStart()}
    if(cmd.startsWith('proto:')){state={view:'intro',proto:cmd.split(':')[1],index:-1};return renderProto()}
    if(cmd==='next'){state.index++;return renderProto()}
    if(cmd==='run'){return renderOutcome('Run Started','The planned activity has started.','STARTED')}
    if(cmd==='skip'){return renderOutcome('Preparation Skipped','No remaining preparation suggestions were applied.','SKIPPED')}
    if(cmd==='eval'){return renderEval()}
    if(cmd==='finish'){return renderFinish()}
    if(cmd==='form'){if(FORM_URL.startsWith('http')) location.href=FORM_URL; else alert('Add your Microsoft Forms response link to FORM_URL in index.html.');}
  }
  function renderStart(){set(`${top('Evaluate Three Pre-Run Concepts','Use the same planned run while exploring each prototype.','#167C80')}<section class="card task"><strong>Your task</strong>Review each concept and prepare for the planned run.<br><br>Tap the center of the circular dial to continue. Use <b>Start Run</b> or <b>Skip</b> when wanted. <b>Resume: Prototypes</b> returns to the prototype page.<div class="scenario">8-mile run • Today at 6:00 PM<br>Warm and humid • About 75 minutes</div><button class="primary" style="--accent:#167C80" data-go="menu">BEGIN</button></section><div class="disclaimer">Educational HCI prototype. This page does not collect or store personal information.</div>`)}
  function renderMenu(){let cards=Object.entries(P).map(([k,v])=>`<article class="proto-card" style="--accent:${v.accent}"><div class="proto-band">PROTOTYPE ${k}</div><div class="proto-body"><h2>${v.name}</h2><p>${v.intro}</p><button class="primary" style="--accent:${v.accent}" data-go="proto:${k}">OPEN</button></div></article>`).join('');set(`${top('Choose a Prototype','Complete all three in the assigned order.','#167C80')}<section class="prototype-grid">${cards}</section><div class="disclaimer">Tap a prototype to begin. Your responses are collected separately in Microsoft Forms.</div>`,'shell menu-shell')}
  function parseLines(s){return s.split('|').map(x=>x.startsWith('*')?`<strong>${esc(x.slice(1))}</strong>`:x.startsWith('~')?`<span class="muted">${esc(x.slice(1))}</span>`:x.startsWith('!')?`<span class="accent-text">${esc(x.slice(1))}</span>`:`<span>${esc(x)}</span>`).join('')}
  function renderProto(){const q=P[state.proto];let head,copy,sub;
    if(state.index<0){head=q.name.toUpperCase();copy=`<strong>${esc(q.intro)}</strong><span class="accent-text" style="font-size:.78rem;letter-spacing:.08em">WHEN IT APPEARS</span><span>${esc(q.when)}</span><span class="muted">${esc(q.availability)}</span>`;sub='What this prototype is and when it appears.'}
    else if(state.index>=q.screens.length){return renderEval()}
    else {head=q.screens[state.index][0];copy=parseLines(q.screens[state.index][1]);sub=state.index===0?'Review the screen and choose what to do next.':'Continue through the preparation flow.'}
    const progress=state.index<0?'Introduction':`Screen ${state.index+1} of ${q.screens.length}`;
    set(`${top(`Prototype ${state.proto}: ${q.name}`,sub,q.accent)}<section class="dial-wrap" style="--accent:${q.accent};--dialBg:${q.bg}"><div class="dial"><div class="dial-face"><div class="proto-label">PROTOTYPE ${state.proto}</div><h2 class="screen-title">${esc(head)}</h2><div class="divider"></div><div class="screen-copy">${copy}</div><button class="center-action" data-go="next">TAP CENTER TO CONTINUE</button><div class="dial-buttons"><button class="start" data-go="run">START RUN</button><button class="skip" data-go="skip">SKIP</button></div></div></div><button class="resume" data-go="menu">RESUME: PROTOTYPES</button><div class="progress">${progress}</div></section><div class="disclaimer">Educational HCI prototype. No information is stored by this page.</div>`)}
  function renderOutcome(title,sub,badge){set(`${top(title,sub,'#4A9A68')}<section class="dial-wrap" style="--accent:#4A9A68;--dialBg:#1D3038"><div class="dial"><div class="dial-face"><h2 class="screen-title">OUTDOOR RUN</h2><div class="divider"></div><div class="screen-copy"><strong>${badge==='STARTED'?'8.0 miles':'Preparation skipped'}</strong><span>${badge==='STARTED'?'Timer started':'The run can still be started'}</span><span class="accent-text">${badge}</span></div><button class="center-action" data-go="eval">CONTINUE TO EVALUATION</button></div></div></section>`)}
  function renderEval(){set(`${top('Evaluate This Prototype','Record your responses before testing the next concept.','#167C80')}<section class="card"><h2>Rate from 1 to 7</h2><ol class="eval-list"><li>The information was relevant.</li><li>The amount of information was appropriate.</li><li>I understood why suggestions appeared.</li><li>I felt in control.</li><li>I would consider using this before a run.</li><li>The controls were clear.</li></ol><h2>Consider</h2><p>What was clear, confusing, disruptive, or missing?</p><div class="actions"><button class="primary" style="--accent:#167C80" data-go="menu">TEST ANOTHER</button><button class="primary" style="--accent:#4A9A68" data-go="finish">FINISH</button></div></section>`)}
  function renderFinish(){set(`${top('Evaluation Complete','Thank you for testing the three pre-run concepts.','#4A9A68')}<section class="card task"><div style="font-size:5rem;color:#4A9A68">✓</div><p>Return to Microsoft Forms and submit your responses.</p><div class="actions"><button class="primary" style="--accent:#4A9A68" data-go="form">OPEN EVALUATION FORM</button><button class="secondary" data-go="start">RESTART</button></div></section>`)}
  renderStart();
})();
</script>
</body>
</html>
