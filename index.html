<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pre-Run Prototype Evaluation</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f5;color:#15242b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:560px;margin:auto;padding:18px 14px 32px;text-align:center}h1{font-size:1.65rem;margin:.35rem 0}p{color:#586a71}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 28px #16313a18}.menu{display:grid;gap:14px}.choice{background:#fff;border:2px solid var(--a);border-radius:18px;padding:0 16px 16px;overflow:hidden}.band{background:var(--a);color:#fff;font-weight:800;margin:0 -16px 14px;padding:12px}.btn{border:0;border-radius:13px;min-height:50px;padding:10px 16px;background:var(--a,#167c80);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;width:100%}.dial{width:min(92vw,460px);aspect-ratio:1;border-radius:50%;background:#101820;padding:18px;margin:18px auto;box-shadow:0 18px 36px #0004;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}.dial:focus-visible{outline:4px solid #fff;outline-offset:4px}.face{height:100%;border-radius:50%;background:var(--bg);border:3px solid var(--a);color:#fff;padding:32px 28px 24px;display:flex;flex-direction:column;align-items:center}.label{font-size:.72rem;font-weight:900;letter-spacing:.12em;color:#cad5d9}.title{font-size:1.45rem;font-weight:900;margin:10px 0}.line{height:3px;background:var(--a);width:75%;margin:0 0 15px}.copy{min-height:128px;display:flex;flex-direction:column;justify-content:center;gap:8px;font-size:1rem}.copy strong{font-size:1.12rem}.muted{color:#cad5d9}.tap-info{margin-top:auto;color:#d7e1e4;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:7px 0 3px;border-bottom:1px solid #ffffff55;width:78%}.inside{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:90%;margin-top:12px}.inside button{border:0;border-radius:12px;min-height:46px;color:#fff;font-weight:900}.start{background:#4a9a68}.skip{background:#687a82}.resume{max-width:360px;margin:0 auto;background:var(--a)}.progress{color:#687a82;margin:12px}.actions{display:grid;gap:10px}.note{font-size:.78rem;color:#718188;margin-top:18px}@media(min-width:760px){.app.wide{max-width:980px}.menu{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main id="app" class="app"></main><script>
const FORM_URL='https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=u5ghSHuuJUuLem1_MvqggxwV7FXws0hPo2AIwZOp6WtUOVZJOThHT0xWQlkzNEI0RkpPWVJUTDJUUC4u';
const P={A:{name:'Visual Dashboard',a:'#167c80',bg:'#124f52',intro:'An on-demand overview of weather, hydration, and pacing.',when:'Shown only when you open pre-run preparation. It is not automatic.',s:[['Pre-Run Dashboard','8.0 miles • about 75 min|Weather • water • pace|~3 preparation items'],['Overview','*Weather: Warm|Hydration: Water suggested|Pace: Start easier'],['Weather','*82°F at start|Humidity: 72%|Light wind|~May feel harder'],['Hydration','*Water recommended|Carry water or plan a refill|~Drink based on thirst'],['Pace','*Start easier|Comfortable effort early|~Adjust to conditions'],['Ready to Run','Weather reviewed|Water considered|Pace reviewed|*READY']]},B:{name:'Exception Briefing',a:'#d86b38',bg:'#67351f',intro:'A brief alert for conditions that differ from the normal running context.',when:'Not shown for every run. It appears only when an important exception is detected.',s:[['Outdoor Run','*Checking conditions…|~No preparation screen by default'],['Attention','*Two short vibrations|Warm + humid conditions|~Briefing available'],['Briefing','*Conditions may increase effort|Carry water|Start easier'],['Why Now?','*82°F • 72% humidity|Warmer than recent runs|Longer planned duration'],['Quick Action','*Water reminder?|Easy-start cue?|~Both remain optional'],['Acknowledged','Water reminder on|Easy-start cue on|~No other exceptions|*READY']]},C:{name:'Preparation Assistant',a:'#6a55a3',bg:'#3e315f',intro:'A conversational assistant that adapts suggestions to the run and recent behavior.',when:'Opened before a planned run. Some insights appear only when relevant history is available.',s:[['Assistant','*Good evening|I can help prepare your run|~8 miles • 6:00 PM'],["Today’s Goal",'*Comfort|Performance|Just essentials'],['Insight','*Recent warm-weather starts|were faster than usual|~Begin slightly easier'],['Why?','Planned distance|Heat + humidity|Recent run pattern'],['Hydration','*Warm + humid expected|Add water reminder?|Show refill options?'],['Your Plan','*Easy start|Water reminder|~Comfort-focused'],['Plan Ready','Suggestions accepted|Reminder added|~Controls remain available|*READY']]}};
let st={p:null,i:-1};const app=document.getElementById('app');
const E=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function set(h,wide=false){app.className='app'+(wide?' wide':'');app.innerHTML=h;window.scrollTo(0,0);bind()}
function bind(){document.querySelectorAll('[data-go]').forEach(el=>el.onclick=e=>{e.stopPropagation();go(el.dataset.go)});document.querySelectorAll('[data-dial]').forEach(el=>{el.onclick=()=>go('next');el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go('next')}}})}
function head(t,sub){return `<h1>${E(t)}</h1><p>${E(sub)}</p>`}
function go(x){if(x==='menu')menu();else if(x.startsWith('p')){st={p:x[1],i:-1};screen()}else if(x==='next'){st.i++;screen()}else if(x==='run')outcome('Run Started','STARTED');else if(x==='skip')outcome('Preparation Skipped','SKIPPED');else if(x==='eval')evaluation();else if(x==='finish')finish();else if(x==='start')start();else if(x==='form'){FORM_URL.startsWith('http')?location.href=FORM_URL:alert('Add the Microsoft Forms link to FORM_URL in index.html.')}}
function start(){set(`${head('Evaluate Three Pre-Run Concepts','Use the same planned run for all three prototypes.')}<section class="card"><h2>Consider a task</h2><p>For this evaluation, imagine that you have planned an 8-mile outdoor run for 6:00 PM today. You expect the run to take approximately 75 minutes. The weather at the planned start time is warm and humid. Tap anywhere on the circular dial to continue. Use Start Run or Skip when wanted. Resume returns to the prototype page.</p><p><b>Today • 6:00 PM • Warm and humid • About 75 minutes</b></p><button class="btn" data-go="menu">BEGIN</button></section><div class="note">Educational HCI prototype. This page does not collect or store personal information.</div>`)}
function menu(){set(`${head('Choose a Prototype','Complete all three in the assigned order.')}<section class="menu">${Object.entries(P).map(([k,v])=>`<article class="choice" style="--a:${v.a}"><div class="band">PROTOTYPE ${k}</div><h2>${v.name}</h2><p>${v.intro}</p><button class="btn" data-go="p${k}">OPEN</button></article>`).join('')}</section>`,true)}
function lines(s){return s.split('|').map(x=>x[0]==='*'?`<strong>${E(x.slice(1))}</strong>`:x[0]==='~'?`<span class="muted">${E(x.slice(1))}</span>`:`<span>${E(x)}</span>`).join('')}
function screen(){const q=P[st.p];if(st.i>=q.s.length)return evaluation();let title,copy,sub;if(st.i<0){title=q.name;copy=`<strong>${E(q.intro)}</strong><span style="color:${q.a};font-weight:900">WHEN IT APPEARS</span><span>${E(q.when)}</span>`;sub='What this prototype is and when it appears.'}else{title=q.s[st.i][0];copy=lines(q.s[st.i][1]);sub='Tap anywhere on the circular dial to continue.'}set(`${head('Prototype '+st.p+': '+q.name,sub)}<section style="--a:${q.a};--bg:${q.bg}"><div class="dial" data-dial role="button" tabindex="0" aria-label="Continue to the next screen"><div class="face"><div class="label">PROTOTYPE ${st.p}</div><div class="title">${E(title)}</div><div class="line"></div><div class="copy">${copy}</div><div class="tap-info" aria-hidden="true">TAP CENTER TO CONTINUE</div><div class="inside"><button class="start" data-go="run">START RUN</button><button class="skip" data-go="skip">SKIP</button></div></div></div><button class="btn resume" data-go="menu">RESUME: PROTOTYPES</button><div class="progress">${st.i<0?'Introduction':`Screen ${st.i+1} of ${q.s.length}`}</div></section>`)}
function outcome(t,b){set(`${head(t,'Continue to the evaluation.')}<section style="--a:#4a9a68;--bg:#1d3038"><div class="dial" data-go="eval" role="button" tabindex="0"><div class="face"><div class="title">OUTDOOR RUN</div><div class="line"></div><div class="copy"><strong>${b}</strong><span>${b==='STARTED'?'Timer started':'No remaining suggestions were applied'}</span></div><div class="tap-info" aria-hidden="true">TAP CENTER TO CONTINUE</div></div></div></section>`)}
function evaluation(){set(`${head('Evaluate This Prototype','Record your responses before testing the next concept.')}<section class="card"><h2>Rate from 1 to 7</h2><p>Information relevance • Amount of information • Explanation clarity • Sense of control • Intention to use • Control clarity</p><h2>Consider</h2><p>What was clear, confusing, disruptive, or missing?</p><div class="actions"><button class="btn" data-go="menu">TEST ANOTHER</button><button class="btn" style="--a:#4a9a68" data-go="finish">FINISH</button></div></section>`)}
function finish(){set(`${head('Evaluation Complete','Thank you for testing the concepts.')}<section class="card"><div style="font-size:5rem;color:#4a9a68">✓</div><p>Open Microsoft Forms and submit your responses.</p><div class="actions"><button class="btn" style="--a:#4a9a68" data-go="form">OPEN EVALUATION FORM</button><button class="btn" style="--a:#687a82" data-go="start">RESTART</button></div></section>`)}start();
</script></body></html>
